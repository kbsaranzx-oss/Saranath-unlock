<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARANATH EFx - PRIVATE SERVER ACCESS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow-y: auto;
            position: relative;
            padding: 20px 0;
        }

        /* பின்னணியில் மெதுவாக மாறும் நியான் க்ளோ */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(0, 255, 0, 0.25);
            border-radius: 50%;
            filter: blur(160px);
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.1); }
        }

        .main-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 90%;
            max-width: 400px;
            margin: auto;
        }

        /* ஒளிரும் தலைப்பு அனிமேஷன் */
        .title {
            color: #00ff00;
            font-size: 2.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: textFlicker 2s infinite alternate;
        }

        @keyframes textFlicker {
            0%, 100% { text-shadow: 0 0 8px #00ff00, 0 0 15px #00ff00; }
            50% { text-shadow: 0 0 15px #00ff00, 0 0 30px #00ff00, 0 0 50px #00ff00; }
        }

        .subtitle {
            color: rgba(0, 255, 0, 0.7);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        /* அனிமேட்டட் பார்டர் கொண்ட முக்கிய பெட்டி */
        .animated-box {
            background-color: rgba(10, 10, 10, 0.95);
            border-radius: 15px;
            padding: 35px;
            width: 100%;
            position: relative;
            z-index: 1;
            /* பார்டர் அனிமேஷன் எஃபெக்ட் */
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            animation: boxGlow 3s infinite alternate;
        }

        @keyframes boxGlow {
            0% { box-shadow: 0 0 15px rgba(0, 255, 0, 0.3), inset 0 0 10px rgba(0, 255, 0, 0.1); border-color: #00cc00; }
            100% { box-shadow: 0 0 30px rgba(0, 255, 0, 0.7), inset 0 0 20px rgba(0, 255, 0, 0.3); border-color: #00ff00; }
        }

        .authenticate-title {
            color: #00ff00;
            text-align: left;
            margin-bottom: 25px;
            font-size: 1rem;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00ff00;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            color: #00ff00;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: bold;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px;
            background-color: #0d0d0d;
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 8px;
            color: #00ff00;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #00ff00;
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.5);
        }

        /* லாகின் பட்டன் அனிமேஷன் */
        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #00ff00;
            color: #000000;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 0 15px #00ff00;
            animation: pulseButton 1.5s infinite;
        }

        @keyframes pulseButton {
            0% { box-shadow: 0 0 10px #00ff00; }
            50% { box-shadow: 0 0 25px #00ff00, 0 0 35px rgba(0, 255, 0, 0.5); }
            100% { box-shadow: 0 0 10px #00ff00; }
        }

        .login-btn:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 30px #ffffff;
        }

        .error-msg {
            color: #ff0000;
            margin-top: 15px;
            font-size: 0.85rem;
            display: none;
            text-shadow: 0 0 8px #ff0000;
        }

        /* சப்ஸ்கிரைப் லாக் பாக்ஸ் */
        #sub-lock-box {
            display: none;
        }

        .sub-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #ff0000;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 15px #ff0000;
            margin-bottom: 15px;
            animation: pulseRedButton 1.5s infinite;
        }

        @keyframes pulseRedButton {
            0%, 100% { box-shadow: 0 0 10px #ff0000; }
            50% { box-shadow: 0 0 25px #ff0000; }
        }

        .unlock-btn {
            width: 100%;
            padding: 14px;
            background-color: transparent;
            border: 2px solid #333333;
            border-radius: 8px;
            color: #555555;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: not-allowed;
            transition: 0.3s;
        }

        .unlock-btn.active {
            border-color: #00ff00;
            color: #00ff00;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }

        /* டவுன்லோட் கன்டென்ட் பாக்ஸ் */
        #success-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-title {
            color: #00ff00;
            font-size: 1.4rem;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background-color: #00ff00;
            color: #000000;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.3);
        }

        .download-btn:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 25px #ffffff;
            transform: scale(1.02);
        }

        .download-btn.outline {
            background-color: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
        }

        .download-btn.outline:hover {
            background-color: #00ff00;
            color: #000000;
            box-shadow: 0 0 20px #00ff00;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="title">SARANATH EFx</div>
        <div class="subtitle">WELCOME BACK TO OUR WEBSITE 🔥</div>

        <div class="animated-box" id="login-form">
            <div class="authenticate-title">>_ AUTHENTICATE</div>

            <div class="input-group">
                <label for="username">USERNAME</label>
                <input type="text" id="username" placeholder="enter username">
            </div>

            <div class="input-group">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" placeholder="enter password">
            </div>

            <button class="login-btn" onclick="validateLogin()">LOGIN HERE 👇⚡</button>
            <div class="error-msg" id="error-text">ACCESS DENIED! WRONG DETAILS.</div>
        </div>

        <div class="animated-box" id="sub-lock-box">
            <div class="success-title" style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">STEP 2: VERIFICATION</div>
            <p style="color: #fff; font-size: 0.85rem; margin-bottom: 20px;">SUBSCRIBE OUR CHANNEL TO UNLOCK DOWNLOAD LINKS!</p>
            
            <a href="https://youtube.com/@sara_nath_efx" target="_blank" class="sub-btn" onclick="clickedSubscribe()">
                SUBSCRIBE CHANNEL 🚨
            </a>

            <button id="unlock-links-btn" class="unlock-btn" onclick="goToDownloads()">CONTINUE NEXT 👉</button>
        </div>

        <div class="animated-box" id="success-content">
            <div class="success-title">ACCESS GRANTED! 😎🚀</div>
            
            <a href="https://www.mediafire.com/file/d7t3x2nscwll7ct/Free_Fire_MAX_ARMv7.apks/file" target="_blank" class="download-btn">
                DOWNLOAD FF 🎮
            </a>

            <a href="https://www.mediafire.com/file/dp80oxwk389i5pg/localConfig.json/file#" target="_blank" class="download-btn outline">
                DOWNLOAD CONFIG ⚙️
            </a>

            <a href="https://unlockffbeta.com/" target="_blank" class="download-btn">
                UID UNLOCK WEBSITE 🔓
            </a>

            <a href="https://dash.unlockffbeta.com/" target="_blank" class="download-btn outline">
                FREE FIRE NAME CHANGE WEBSITE 📝
            </a>
        </div>
    </div>

    <script>
        var subscribed = false;

        function validateLogin() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;
            var errorText = document.getElementById("error-text");
            var loginForm = document.getElementById("login-form");
            var subLockBox = document.getElementById("sub-lock-box");

            var correctUser = "2233";
            var correctPass = "1122";

            if (user === correctUser && pass === correctPass) {
                loginForm.style.display = "none";
                subLockBox.style.display = "block";
            } else {
                errorText.style.display = "block";
                setTimeout(function(){
                    errorText.style.display = "none";
                }, 3000);
            }
        }

        function clickedSubscribe() {
            subscribed = true;
            var unlockBtn = document.getElementById("unlock-links-btn");
            unlockBtn.classList.add("active");
        }

        function goToDownloads() {
            if (subscribed) {
                document.getElementById("sub-lock-box").style.display = "none";
                document.getElementById("success-content").style.display = "block";
            }
        }
    </script>
</body>
</html>
